<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.title">
  </h1>
  <p class="homey-subtitle" data-i18n="pair.subtitle">
  </p>
</header>

<form class="homey-form" id="loginForm">
	<div class="homey-form-group">

		<label class="homey-form-label" for="region" data-i18n="pair.region">Select your region</label>
		<!-- Filled by loadRegions() below: which regions exist depends on the
		     brand this app was published as (Brazil is Hyundai only). -->
		<select class="homey-form-select" id="region"></select>

		<label class="homey-form-label" for="username" data-i18n="pair.username">username</label>
		<input class="homey-form-input" id="username" type="text" placeholder="" value="" />

		<label class="homey-form-label" for="password" data-i18n="pair.password">password</label>
		<input class="homey-form-input" id="password" type="password" placeholder="" value="" />

		<label class="homey-form-label" for="pin" data-i18n="pair.pin">pin</label>
		<input class="homey-form-input" id="pin" maxlength="4" type="password" placeholder="" value="" />
		<p class="homey-subtitle" data-i18n="pair.pin_hint"></p>

	</div>
</form>
<br>
<button class="homey-button-primary-full" id="runTest" onclick="validate()" data-i18n="pair.validate" >continue</button>

<!-- Only shown when a CA / Kia US login answers with an OTP challenge. -->
<form class="homey-form" id="otpForm" style="display: none;">
	<fieldset class="homey-form-fieldset">
		<legend class="homey-form-legend" data-i18n="pair.otp_title"></legend>
		<p class="homey-subtitle" data-i18n="pair.otp_intro"></p>
		<fieldset class="homey-form-radio-set">
			<label class="homey-form-radio" id="otpEmailRow">
				<input class="homey-form-radio-input" type="radio" name="otpTarget" value="EMAIL" checked />
				<span class="homey-form-radio-checkmark"></span>
				<span class="homey-form-radio-text" id="otpEmailText"></span>
			</label>
			<label class="homey-form-radio" id="otpSmsRow">
				<input class="homey-form-radio-input" type="radio" name="otpTarget" value="SMS" />
				<span class="homey-form-radio-checkmark"></span>
				<span class="homey-form-radio-text" id="otpSmsText"></span>
			</label>
		</fieldset>
		<div class="homey-form-group" id="otpCodeGroup" style="display: none;">
			<label class="homey-form-label" for="otpCode" data-i18n="pair.otp_code"></label>
			<input class="homey-form-input" id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code" value="" />
		</div>
	</fieldset>
</form>
<br>
<button class="homey-button-primary-full" id="otpSend" style="display: none;" onclick="sendOtp()" data-i18n="pair.otp_send"></button>
<br>
<button class="homey-button-primary-full" id="otpVerify" style="display: none;" onclick="verifyOtp()" data-i18n="pair.otp_verify"></button>

<script type="text/javascript">

async function validate() {
  try {
    const region = $('#region').val();
    const username = $('#username').val().trim();
    const password = $('#password').val().trim();
    const pin = $('#pin').val().trim();

    if (username === '' || password === '' || pin === '') {
      throw Error(__('pair.required'));
    }
    if (pin.length !== 4) {
      throw Error(__('pair.invalid_pin'));
    }
    const settings = {
      region,
      username,
      password,
      pin,
    };
    // Continue to back-end, pass along data
    Homey.showLoadingOverlay();
    const result = await Homey.emit('validate', settings);
    if (result && result.otp) {
      Homey.hideLoadingOverlay();
      showOtp(result.otp);
      return;
    }
    Homey.hideLoadingOverlay();
    Homey.showView('list_devices');
  } catch (error) {
    Homey.hideLoadingOverlay();
    Homey.alert(error, 'error');
  }
}

function showOtp(otp) {
  $('#loginForm').hide();
  $('#runTest').hide();
  $('#otpEmailText').text(__('pair.otp_email') + (otp.email ? ` (${otp.email})` : ''));
  $('#otpSmsText').text(__('pair.otp_sms') + (otp.sms ? ` (${otp.sms})` : ''));
  $('#otpEmailRow').toggle(otp.hasEmail !== false);
  $('#otpSmsRow').toggle(!!otp.hasSms);
  if (otp.hasEmail === false) $('input[name="otpTarget"][value="SMS"]').prop('checked', true);
  $('#otpForm').show();
  $('#otpSend').show();
}

async function sendOtp() {
  try {
    Homey.showLoadingOverlay();
    await Homey.emit('otp_send', $('input[name="otpTarget"]:checked').val());
    Homey.hideLoadingOverlay();
    $('#otpCodeGroup').show();
    $('#otpVerify').show();
  } catch (error) {
    Homey.hideLoadingOverlay();
    Homey.alert(error, 'error');
  }
}

async function verifyOtp() {
  try {
    const code = $('#otpCode').val().trim();
    if (code === '') throw Error(__('pair.required'));
    Homey.showLoadingOverlay();
    await Homey.emit('otp_verify', code);
    Homey.hideLoadingOverlay();
    Homey.showView('list_devices');
  } catch (error) {
    Homey.hideLoadingOverlay();
    Homey.alert(error, 'error');
  }
}

// The driver answers with the region ids its brand has a backend for
// (lib/connect#regionsForBrand). The fallback list is what every brand
// supports, so a failed request still leaves a usable picker.
async function loadRegions() {
  let regions = ['EU', 'US', 'CA', 'AU', 'CN'];
  try {
    const supported = await Homey.emit('regions');
    if (Array.isArray(supported) && supported.length) regions = supported;
  } catch (error) {
    // keep the fallback list
  }
  const select = document.getElementById('region');
  select.innerHTML = '';
  regions.forEach((id, index) => {
    const option = document.createElement('option');
    option.value = id;
    option.text = __('pair.region_' + id.toLowerCase());
    option.selected = index === 0;
    select.appendChild(option);
  });
}

$(document).ready(loadRegions);

// $(document).ready(async () => {
//   Homey.setTitle(Homey.__('pair.start'));
// });

</script>
